# SmartDNS 优化配置 - Kevin Network
# 国内网络优化版

config smartdns
    option enabled '1'
    option server_name 'SmartDNS-Kevin'
    option port '5335'
    option bind '[::]:5335'
    # 国外 DNS (TCP + HTTPS)
    option server-tcp '8.8.8.8:53'
    option server-tcp '1.1.1.1:53'
    option server-https 'https://1.1.1.1/dns-query'
    option server-https 'https://dns.google/dns-query'
    # 测速配置
    option speed-check-mode 'ping,tcp:80,tcp:443'
    option tcp-concurrent '1'
    # 缓存配置 (大幅优化)
    option cache-size '10000'
    option cache-persist '1'
    option prefetch-domain '1'
    option serve-expired '1'
    option serve-expired-ttl '86400'
    # TTL 配置
    option rr-ttl-min '300'
    option rr-ttl-max '86400'
    option rr-ttl-reply-max '300'
    # 其他优化
    option force-qtype-SOA '65'
    option deny-domain-served '.'

config server 'group-domestic'
    option name '国内DNS组'
    option type 'group'
    list server '119.29.29.29'
    list server '223.5.5.5'
    list server '119.28.28.28'
    list server '223.6.6.6'
    option strategy 'default'

config server 'group-foreign'
    option name '国外DNS组'
    option type 'group'
    list server '8.8.8.8'
    list server '1.1.1.1'
    list server '208.67.222.222'
    option strategy 'default'

config domain-rules '/cn/'
    option name '国内域名走国内DNS'
    option server 'group-domestic'
    option dest-queue 'group-domestic'
    option ipset 'chnroute'
    option nftset 'chnroute#4#inet'

config domain-rules '/googleapis.cn/'
    option name 'Google CN'
    option server 'group-domestic'

config domain-rules '/googleapis.com/'
    option name 'Google'
    option server 'group-foreign'
    option ipset 'gfwlist'
    option nftset 'gfwlist#4#inet'

config nameserver 'china'
    option name '国内DNS'
    list server '119.29.29.29'
    list server '223.5.5.5'

config nameserver 'foreign'
    option name '国外DNS'
    list server '8.8.8.8'
    list server '1.1.1.1'
